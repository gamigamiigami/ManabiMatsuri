<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=10.0, user-scalable=yes">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>應中秘寶調査録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&family=IM+Fell+DW+Pica:ital@0;1&family=IM+Fell+English+SC&family=New+Tegomin&family=Yuji+Mai&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<style>
  /* I. Start — 灯下に置かれた紋。中央やや下に大きく、周りは暗い羅針の環 */
  body.scr-start .frame {
    background-color: #0d0a07;
    background-image:
      radial-gradient(ellipse 60% 32% at 50% 15%, rgba(198, 142, 62, .24), transparent 68%),
      radial-gradient(ellipse 84% 46% at 50% 108%, rgba(120, 38, 22, .22), transparent 72%),
      var(--noise);
  }
  .start-ring {
    position: absolute;
    left: -90px; top: 300px;
    width: 420px; height: 420px;
  }
  .start-topline {
    position: absolute; left: 0; right: 0; top: 0; height: 16px;
    background: repeating-linear-gradient(90deg, rgba(212,176,112,.26) 0 1px, transparent 1px 13px);
    z-index: 1;
  }
  .start-frameline { position: absolute; inset: 22px; border: 1px solid rgba(184,150,88,.24); pointer-events: none; z-index: 1; }
  .start-frameline.inner { inset: 26px; border-color: rgba(184,150,88,.11); }
  .start-body { display: flex; padding: 56px 30px 150px; }
  .start-col-left { flex: 1; display: flex; flex-direction: column; align-items: flex-start; }
  .dossier-rule { margin: 12px 0 0; width: 1px; height: 52px; background: linear-gradient(180deg, rgba(160,132,80,.5), transparent); }
  .start-col-right { width: 176px; display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
  .start-sub-jp { font-family: var(--font-body); font-size: 12.5px; letter-spacing: .34em; color: #96804f; height: 130px; }
  /* 縦書きの表題には高さを持たせておく。書體が落ちた環境では
     縦組みの字送りが得られず、七字が数 px に潰れて重なつて見える。
     会場の通信が死んで Google Fonts が届かない場合への備へでもある。 */
  .start-title-jp { min-height: 336px; margin: 0; font-family: var(--font-head); font-size: 48px; font-weight: 400; line-height: 1.26; letter-spacing: .06em; color: var(--parchment-100); text-shadow: 0 2px 22px rgba(0,0,0,.92), 0 0 44px rgba(196,142,62,.2); }
  .start-desc-jp { margin-top: 12px; font-family: var(--font-body); font-size: 13px; line-height: 2.3; color: #b9a780; height: 190px; letter-spacing: .08em; }
  .start-actions { position: absolute; left: 30px; right: 30px; bottom: 30px; z-index: 2; }
  .start-crest-wrap { text-align: center; margin-bottom: 20px; }
  .start-caption { margin-top: 13px; text-align: center; }
  .start-manual { display: flex; flex-direction: column; gap: 10px; }
  .start-manual input {
    padding: 15px 14px; border: 1px solid #6a5a3c;
    background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.3));
    box-shadow: inset 0 2px 5px rgba(0,0,0,.6);
    color: var(--parchment-100); font-family: var(--font-italic); font-size: 18px; letter-spacing: .16em;
    text-align: center;
  }
  .start-manual input::placeholder { color: #7b6a49; }
  .start-choice { display: flex; flex-direction: column; gap: 12px; text-align: center; }
</style>
</head>
<body class="dark scr-start">
<div class="frame screen">
  <div class="start-topline"></div>
  <div class="start-ring compass-ring"></div>
  <div class="start-ring compass-ring" style="inset:auto;border:1px solid rgba(212,176,112,.12);background:none"></div>
  <div class="start-frameline"></div>
  <div class="start-frameline inner"></div>
  <div class="vignette-dark"></div>

  <div class="start-body" style="position:relative;z-index:2;flex:1">
    <div class="start-col-left">
      <div class="label" id="dossier-label" style="color:#8e7548">Dossier<br>No. I</div>
      <div class="dossier-rule"></div>
      <div class="italic-en" style="color:#6f5c39;font-size:13px">Survey of the<br>Ō-Chū grounds<br>vol. i</div>
    </div>
    <div class="start-col-right">
      <div class="start-sub-jp vertical-jp" id="site-subtitle"></div>
      <h1 class="start-title-jp vertical-jp" id="site-title"></h1>
    </div>
  </div>

  <div class="start-actions" id="start-status" aria-live="polite">
    <!-- main() が状態に応じて描画する -->
  </div>
</div>

<script src="js/vendor/supabase.js"></script>
<script type="module">
import { CONFIG, team, teamOf, normalizePid } from "./js/config.js";
import { renderCrest } from "./js/crest.js";
import * as store from "./js/store.js";
import { go, href, params } from "./js/nav.js";
import { teamText } from "./js/ui.js";
import { mountDebug } from "./js/debug.js";

document.getElementById("site-title").textContent = CONFIG.SITE.title;
document.getElementById("site-subtitle").textContent = CONFIG.SITE.subtitle;

const statusEl = document.getElementById("start-status");

function crestHtml(teamKey, size) {
  try {
    return renderCrest({ team: teamKey, variant: "own", size });
  } catch (e) {
    return "";
  }
}

function nextTarget() {
  // params() は URLSearchParams で既に一度デコード済みなので、ここで
  // 二重にデコードしない（next の中身に % を含む値があると壊れるため）。
  const p = params();
  return p.next || "folio.html";
}

function renderConfirm(pid, teamKey, continuing) {
  const t = team(teamKey);
  statusEl.innerHTML =
    '<div class="start-crest-wrap"><div class="crest-frame" style="width:150px;height:150px;margin:0 auto">' +
    crestHtml(teamKey, 150) +
    "</div></div>" +
    '<button type="button" class="btn-lamp" style="width:100%" data-testid="start-btn">' +
    (continuing ? "調査を續ける" : "調査を開始する") +
    "</button>" +
    '<div class="italic-en start-caption" style="color:#75623f">' +
    teamText(teamKey, "for the eyes of {romaji} alone") +
    "</div>";

  statusEl.querySelector('[data-testid="start-btn"]').addEventListener("click", () => {
    if (!continuing) store.setPid(pid);
    go(nextTarget());
  });
}

function renderError(message) {
  statusEl.innerHTML =
    '<div class="pid-error" data-testid="pid-error">' + message + "</div>" +
    '<div style="margin-top:16px">' + manualFormHtml() + "</div>";
  wireManualForm();
}

function manualFormHtml() {
  return (
    '<div class="start-manual">' +
    '<input type="text" id="manual-pid" placeholder="番号（例：K017）を入れる" autocomplete="off">' +
    '<button type="button" class="btn-lamp" data-testid="start-btn">調査を開始する</button>' +
    "</div>"
  );
}

function wireManualForm() {
  const input = document.getElementById("manual-pid");
  const btn = statusEl.querySelector('[data-testid="start-btn"]');
  btn.addEventListener("click", () => {
    const raw = input.value;
    const pid = normalizePid(raw);
    const t = pid ? teamOf(pid) : null;
    if (!pid || !t) {
      renderError("その番号は見当たりません。文字を確かめるか、受付の者へ尋ねよ。");
      return;
    }
    renderConfirm(pid, t, false);
  });
}

function renderManualEntry() {
  statusEl.innerHTML = manualFormHtml();
  wireManualForm();
}

function renderOtherPersonChoice(savedPid, otherPid) {
  const otherTeam = teamOf(otherPid);
  statusEl.innerHTML =
    '<div class="start-choice">' +
    '<div class="body-text" style="color:#d2bd99">これは別の調査員の印のようだ。<br>共同調査の相手として讀み込むか？</div>' +
    '<div class="btn-row">' +
    '<button type="button" class="btn" id="as-partner">相手として進む</button>' +
    '<button type="button" class="btn" id="keep-own">自分の記録を續ける</button>' +
    "</div></div>";
  document.getElementById("as-partner").addEventListener("click", () => {
    if (!otherTeam) return;
    go(href("together.html", { with: otherPid }));
  });
  document.getElementById("keep-own").addEventListener("click", () => {
    go("folio.html");
  });
}

function main() {
  const savedPid = store.getPid();
  const p = params();
  const qPid = p.pid ? normalizePid(p.pid) : null;

  if (savedPid) {
    if (qPid && qPid !== savedPid) {
      renderOtherPersonChoice(savedPid, qPid);
      return;
    }
    const t = teamOf(savedPid);
    renderConfirm(savedPid, t || CONFIG.TEAM_ORDER[0], true);
    return;
  }

  if (p.pid) {
    const t = qPid ? teamOf(qPid) : null;
    if (!qPid || !t) {
      renderError("その印は讀み取れません。受付にお申し出ください。");
      return;
    }
    renderConfirm(qPid, t, false);
    return;
  }

  renderManualEntry();
}

// bfcache から戻ったときは素直に読み直す（zoom-fix.js と同じ考え方）
window.addEventListener("pageshow", (e) => {
  if (e.persisted) location.reload();
});

store.flushPending();
main();
mountDebug();
</script>
</body>
</html>
