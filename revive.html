<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/zoom-fix.js"></script>
<title>解呪の詠唱 | O中の封印を解け！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .revive-card h2 { background: linear-gradient(135deg, #7bc68f, #3d8a54); color: #0a2010; }
  .revive-text { text-align: center; font-family: "Yuji Syuku", serif; font-size: 1.1rem; line-height: 2; color: #ecdff0; white-space: pre-wrap; margin: 16px 0; }
  .revive-rune { text-align: center; font-size: 1.6rem; letter-spacing: 0.5em; color: var(--gold); text-shadow: 0 0 18px rgba(212, 175, 106, 0.5); margin: 20px 0; animation: runeGlow 2s ease-in-out infinite alternate; }
  @keyframes runeGlow { 0% { opacity: 0.6; } 100% { opacity: 1; text-shadow: 0 0 28px rgba(212, 175, 106, 0.8); } }
  .revive-ok { text-align: center; font-family: "Yuji Syuku", serif; font-size: 1.2rem; color: #7bc68f; text-shadow: 0 0 14px rgba(123, 198, 143, 0.4); margin: 20px 0; }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="moon"></div>
  <div class="fog fog1"></div>
  <div class="fog fog2"></div>
  <div class="fog fog3"></div>
  <div class="runes">
    <span>応</span><span>時</span><span>親</span><span>子</span><span>学</span><span>鍵</span><span>在</span><span>謎</span><span>封</span><span>解</span><span>鍵</span><span>封</span><span>解</span><span>謎</span>
  </div>
  <div class="vignette"></div>
</div>
<div class="wrap">
  <header class="site">
    <div class="subtitle">転校生Xからの挑戦状</div>
    <h1>解呪の詠唱</h1>
    <div class="ornament">✦ ─── ◆ ─── ✦</div>
  </header>

  <section class="card revive-card" id="reviveCard">
    <h2>復活の呪文</h2>
    <div class="revive-rune">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</div>
    <div class="revive-text" id="reviveText">大人が復活の呪文を唱えている……</div>
    <div class="revive-ok" id="reviveOk" hidden></div>
    <a class="btn gold" id="reviveBtn" href="#" hidden style="margin-top:16px;">→ 謎に再挑戦する</a>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script>
(function () {
  var team = Store.load();
  if (!team) {
    location.replace("index.html");
    return;
  }

  var textEl = document.getElementById("reviveText");
  var okEl = document.getElementById("reviveOk");
  var btnEl = document.getElementById("reviveBtn");

  // このページへの到達がブラウザの「戻る／進む」によるものかを判定する。
  // QRを読み取った直後の遷移は type が "navigate"、
  // 一度離れたあとに戻る操作で再びこのページに来た場合は "back_forward" になる。
  // これを許すと、再び呪われたときにQRを読まずブラウザバックだけで
  // 復活の呪文を再発動できてしまうため、この場合は呪いを解除しない。
  var navEntries = performance.getEntriesByType && performance.getEntriesByType("navigation");
  var navType = (navEntries && navEntries[0] && navEntries[0].type) ||
    (performance.navigation ? ["navigate", "reload", "back_forward"][performance.navigation.type] : "navigate");

  if (navType === "back_forward") {
    textEl.textContent = "この呪文は、もう使えないようだ。\nもう一度、スタッフの復活QRを読み取ってね。";
    btnEl.textContent = "→ ホームへ戻る";
    btnEl.href = "index.html";
    btnEl.hidden = false;
    return;
  }

  // どのポイントがバックラッシュ中か探す
  var cursedPoint = null;
  POINT_ORDER.forEach(function (q) {
    if (team.points[q] && team.points[q].cursed && !team.points[q].solvedAt) {
      cursedPoint = q;
    }
  });

  if (!cursedPoint) {
    textEl.textContent = "Xの呪いは受けていないようだ。\n冒険を続けよう。";
    btnEl.textContent = "→ ホームへ戻る";
    btnEl.href = "index.html";
    btnEl.hidden = false;
    return;
  }

  // このページに来た時点で即座に呪いを解除する（ボタンを押すかどうかに関係なく消費）。
  team.points[cursedPoint].cursed = false;
  team.points[cursedPoint].revivedAt = new Date().toISOString();
  Store.save(team);
  Store.send(team, "revived", cursedPoint, {});

  // 復活演出（少し待ってから表示。正解時の金の魔法陣とは違う緑紫の解呪演出）
  setTimeout(function () {
    FX.dispel({ count: 18 });
    textEl.textContent = "Xの呪いが、解けていく──";
    okEl.textContent = "復活完了！もう一度挑戦できるぞ。";
    okEl.hidden = false;
    btnEl.textContent = "→ " + PUZZLES[cursedPoint].title + " に再挑戦する";
    btnEl.href = "point.html?p=" + cursedPoint + "&revived=1";
    btnEl.hidden = false;
  }, 1500);

  // bfcacheから復元された場合は状態を再評価するため強制リロードする
  window.addEventListener("pageshow", function (e) {
    if (e.persisted) location.reload();
  });
})();
</script>
</body>
</html>
