<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=10.0, user-scalable=yes">
<script src="js/zoom-fix.js"></script>
<title>？？？ | 応中の封印を解け！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* 答えの入力欄（secret.html の .word-row と同じ見た目にしてある） */
  .word-row { max-width: 340px; margin: 14px auto 0; }
  input.word-input {
    display: block; width: 100%; max-width: 340px; margin: 0 auto;
    padding: 14px 16px;
    border: 1px solid rgba(245, 196, 81, 0.45); border-radius: 8px;
    background: rgba(255, 255, 255, 0.94);
    color: #1b1420;
    font-family: "Shippori Mincho B1", serif;
    font-size: 1.35rem; letter-spacing: 0.18em; text-align: center;
  }
  input.word-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245, 196, 81, 0.22); }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="moon"></div>
  <div class="fog fog1"></div>
  <div class="fog fog2"></div>
  <div class="fog fog3"></div>
  <div class="runes">
    <span>応</span><span>時</span><span>親</span><span>子</span><span>学</span><span>鍵</span><span>在</span><span>謎</span><span>封</span><span>解</span><span>鍵</span><span>封</span><span>解</span><span>謎</span>
  </div>
  <div class="vignette"></div>
</div>
<div class="wrap">
  <header class="site">
    <div class="subtitle">転校生Xからの挑戦状</div>
    <h1 id="pageTitle">？？？</h1>
    <div class="ornament">✦ ─── ◆ ─── ✦</div>
  </header>

  <!-- 運営からのお知らせ（js/announce.js）。定期的にGASへ取りに行き、
       配信中のときだけ<dialog>のshowModal()で出す。ブラウザのトップレイヤーに
       描画されるため、ページ内の他の要素・アニメーションに関係なく必ず最前面に出る。
       合言葉は不要（進捗などの個人情報は含まない）。 -->
  <dialog class="announce-modal" id="announceBanner">
    <div class="announce-modal-icon">📯</div>
    <p class="announce-modal-text" id="announceText"></p>
    <button type="button" class="btn gold announce-modal-btn" id="announceCloseBtn">わかった！</button>
  </dialog>

  <!-- デバッグ表示中バナー（?debug=1 のときだけ表示。記録は一切送信されない） -->
  <div class="card debug-banner" id="debugBanner" hidden>
    <p>🔧 デバッグ表示中（チーム未登録・記録されません）</p>
  </div>

  <!-- ゲート：これはジャンプの謎だ -->
  <section class="card" id="gateCard" hidden>
    <h2>🃏 これは「ジャンプの謎」だ</h2>
    <div class="question">封印の鍵は、ここにはない。
この謎を解いても、封印は解けない。
Xが気まぐれで仕込んだ、本編とは無関係のおまけだ。

……それでも解く？</div>
    <button class="btn gold" id="challengeBtn">それでも解く</button>
    <a class="btn ghost small" href="index.html">やめておく（ホームへ）</a>
    <p class="note center" id="gateCount"></p>
  </section>

  <!-- ジャンプの謎 本体 -->
  <section class="card" id="puzzleCard" hidden>
    <h2 id="puzzleTitle"></h2>
    <div class="question" id="question"></div>
    <div class="word-row">
      <input type="text" class="word-input" id="answerInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="　　　　">
    </div>
    <button class="btn gold" id="submitBtn" style="margin-top:14px;">これだ！と思ったら</button>
    <div class="feedback" id="feedback"></div>
    <div class="hint-box" id="hintBox" hidden>
      <span class="tag">🌟 妖精のささやき</span>
      <div id="hintText"></div>
    </div>
    <button class="btn ghost small" id="hintBtn" style="margin-top:14px;">🌟 ヒントを見る</button>
  </section>

  <!-- クリア後 -->
  <section class="card" id="solvedCard" hidden>
    <div class="key-get">
      <div class="lead">─ まやかしの封印を見破った ─</div>
      <div class="keynum">🃏</div>
      <p class="note center" id="dummyCount"></p>
      <p class="note center">封印の鍵は増えないけれど……君の探究心は本物だ。</p>
      <p class="note center">気が向いたら、ほかの「ジャンプの謎」も探してみて。</p>
    </div>
  </section>

  <div id="backHome" hidden>
    <a class="btn" href="index.html">進捗を見る（ホームへ）</a>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/announce.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script src="js/gimmicks.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const d = params.get("d");
  const isDebug = params.get("debug") === "1" && CONFIG.DEBUG_ENABLED;

  if (!DUMMY_PUZZLES[d]) {
    location.replace("index.html");
    return;
  }

  let team = Store.load();
  if (!team) {
    if (isDebug) {
      team = { teamId: null, teamName: "（デバッグ）", points: {}, dummies: {} };
      document.getElementById("debugBanner").hidden = false;
    } else {
      location.replace("index.html?dummy=" + encodeURIComponent(d));
      return;
    }
  }

  const puzzle = DUMMY_PUZZLES[d];
  const state = Store.dummy(team, d);
  const via = params.get("via") === "manual" ? "manual" : "qr";

  // stage / just は「自分で読み込み直した」ときの目印なので、
  // QRを読んだ扱いで記録を二重に送らないようにする。
  const isSelfReload = params.get("stage") === "puzzle" || params.get("just") === "1";
  if (!isDebug && !isSelfReload) {
    // ダミーはポイント扱いしない（現在地は動かさない）。detailに番号を入れて記録
    Store.send(team, "dummy_scan", null, { dummy: Number(d), via: via });
  }

  function countText() {
    return "見つけて解いたジャンプの謎：" + Store.dummySolvedCount(team) + " / " + DUMMY_TOTAL;
  }

  function showSolved() {
    document.getElementById("gateCard").hidden = true;
    document.getElementById("puzzleCard").hidden = true;
    document.getElementById("dummyCount").textContent = countText();
    document.getElementById("solvedCard").hidden = false;
    document.getElementById("backHome").hidden = isDebug;
    window.resetZoomAndScroll();
  }

  // 解いたことがあるならそのままクリア表示
  if (state.solvedAt) {
    showSolved();
    return;
  }

  // ---------- ゲート表示 / 謎本体 ----------
  // 最後の謎（本編）をすでにクリアしたあとなら、封印とは無関係なのは
  // 分かりきっているので「それでも解く？」の確認は挟まず、いきなり謎を出す。
  const mainCleared = !!(team.secretGate && team.secretGate.solvedAt);
  // stage=puzzle で «読み込み直して» 来たときも、いきなり謎を出す（等倍に戻すため）
  if (mainCleared || params.get("stage") === "puzzle") {
    document.getElementById("puzzleCard").hidden = false;
    if (!isDebug) Store.send(team, "dummy_challenge", null, { dummy: Number(d) });
  } else {
    document.getElementById("gateCard").hidden = false;
    document.getElementById("gateCount").textContent = countText();
  }

  document.getElementById("challengeBtn").addEventListener("click", function () {
    window.gotoFresh("dummy.html?d=" + d + "&stage=puzzle" + (isDebug ? "&debug=1" : ""));
  });

  // ---------- 謎本体 ----------
  document.getElementById("pageTitle").textContent = puzzle.title;
  document.getElementById("puzzleTitle").textContent = puzzle.title;

  const qEl = document.getElementById("question");
  qEl.textContent = puzzle.question;
  if (puzzle.image) {
    const img = document.createElement("img");
    img.src = puzzle.image;
    img.alt = "謎の画像";
    img.onerror = function () { this.remove(); };
    qEl.appendChild(img);
  }

  const hintBox = document.getElementById("hintBox");
  const hintBtn = document.getElementById("hintBtn");
  hintBtn.addEventListener("click", function () {
    document.getElementById("hintText").textContent = puzzle.smallHint;
    hintBox.hidden = false;
    hintBtn.hidden = true;
  });

  const feedback = document.getElementById("feedback");
  const answerInput = document.getElementById("answerInput");
  const submitBtn = document.getElementById("submitBtn");

  answerInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") submitBtn.click();
  });

  submitBtn.addEventListener("click", function () {
    if (state.solvedAt) return;
    const v = answerInput.value;
    if (!v.trim()) {
      feedback.className = "feedback ng";
      feedback.textContent = "答えを入力してね。";
      return;
    }
    if (matchDummyAnswer(puzzle, v)) {
      feedback.className = "feedback ok";
      feedback.textContent = "見破った──これは、まやかし。";
      const c = FX.centerOf(submitBtn);
      FX.burst({ x: c.x, y: c.y, count: 12 });
      state.solvedAt = new Date().toISOString();
      if (!isDebug) {
        Store.save(team);
        Store.send(team, "dummy_correct", null, { dummy: Number(d), wrongCount: state.wrong });
      }
      // 本編（扉＋学校の秘密）をすでにクリアしていて、これがジャンプの謎
      // 最後の1つだったなら、完全制覇の証へそのまま送る。
      const nowFullClear =
        !!(team.finalGate && team.finalGate.solvedAt) &&
        !!(team.secretGate && team.secretGate.solvedAt) &&
        Store.dummySolvedCount(team) >= DUMMY_TOTAL;
      // 画面を差し替えるのではなく «読み込み直して» 等倍に戻す
      setTimeout(function () {
        if (nowFullClear) {
          window.gotoFresh("complete.html");
        } else {
          window.gotoFresh("dummy.html?d=" + d + "&just=1" + (isDebug ? "&debug=1" : ""));
        }
      }, 1200);
    } else {
      feedback.className = "feedback ng";
      feedback.textContent = "あれれ？ちがうみたい……もう一度考えてみて！";
      state.wrong += 1;
      if (!isDebug) {
        Store.save(team);
        Store.send(team, "dummy_wrong", null, { dummy: Number(d), answer: v });
      }
      answerInput.select();
    }
  });
})();
</script>
</body>
</html>
