<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍵謎に挑戦 | O中の封印を解け！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="moon"></div>
  <div class="fog fog1"></div>
  <div class="fog fog2"></div>
  <div class="fog fog3"></div>
  <div class="runes">
    <span>応</span><span>時</span><span>親</span><span>子</span><span>学</span><span>鍵</span><span>在</span><span>謎</span><span>封</span><span>解</span><span>鍵</span><span>封</span><span>解</span><span>謎</span>
  </div>
  <div class="vignette"></div>
</div>
<div class="wrap">
  <header class="site">
    <div class="subtitle">転校生Xからの挑戦状</div>
    <h1 id="pageTitle">鍵謎に挑戦</h1>
    <div class="ornament">✦ ─── ◆ ─── ✦</div>
  </header>

  <!-- デバッグ表示中バナー（?debug=1 のときだけ表示。記録は一切送信されない） -->
  <div class="card debug-banner" id="debugBanner" hidden>
    <p>🔧 デバッグ表示中（チーム未登録・記録されません）</p>
  </div>

  <div class="stars" id="stars"></div>

  <!-- 鍵謎 -->
  <section class="card" id="puzzleCard" hidden>
    <h2 id="puzzleTitle"></h2>
    <p class="note center" id="placeName"></p>
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <div class="hint-box" id="hintBox" hidden>
      <span class="tag">🌟 妖精のささやき</span>
      <div id="hintText"></div>
    </div>
    <button class="btn ghost small" id="hintBtn" style="margin-top:14px;">🌟 ヒントを見る</button>
    <p class="note">どうしても解けないときは、近くのスタッフに声をかけてね。</p>
  </section>

  <!-- 正解後：鍵の獲得＋在り処謎（ゲート式：正解前は絶対に表示されない） -->
  <section class="card" id="solvedCard" hidden>
    <div class="key-get">
      <svg class="keyring" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="92" stroke="#d4af6a" stroke-width="1.2" opacity="0.8"/>
        <circle cx="100" cy="100" r="84" stroke="#d4af6a" stroke-width="0.6" opacity="0.5"/>
        <circle cx="100" cy="100" r="66" stroke="#9b7fe8" stroke-width="0.9" opacity="0.6" stroke-dasharray="5 7"/>
        <polygon points="100,14 26,143 174,143" fill="none" stroke="#d4af6a" stroke-width="0.8" opacity="0.5"/>
        <polygon points="100,186 26,57 174,57" fill="none" stroke="#d4af6a" stroke-width="0.8" opacity="0.5"/>
      </svg>
      <div class="lead" id="keyLead">─ 封印の鍵を手に入れた ─</div>
      <div class="keynum" id="keyNumber"></div>
      <p class="note" id="keyNote">この数字は最後の扉で使うよ。忘れないようにメモしてね！</p>
    </div>
  </section>

  <section class="card" id="arikaCard" hidden>
    <h2>📜 在り処謎</h2>
    <div class="question" id="arikaImageBox"></div>
  </section>

  <div id="backHome" hidden>
    <a class="btn" href="index.html">進捗を見る（ホームへ）</a>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const p = params.get("p");
  const via = params.get("via") === "manual" ? "manual" : "qr";
  const isDebug = params.get("debug") === "1" && CONFIG.DEBUG_ENABLED;

  if (!PUZZLES[p]) {
    location.replace("index.html");
    return;
  }

  // デバッグ表示：チーム未登録でも謎を確認できる（記録は一切送らない）
  let team = Store.load();
  if (!team) {
    if (isDebug) {
      team = { teamId: null, teamName: "（デバッグ）", points: {} };
      document.getElementById("debugBanner").hidden = false;
    } else {
      location.replace("index.html?next=" + encodeURIComponent(p));
      return;
    }
  }

  const puzzle = PUZZLES[p];
  const state = Store.point(team, p);

  if (!isDebug) {
    Store.send(team, "scan", p, { via: via });
  }

  document.getElementById("stars").innerHTML = POINT_ORDER.map(function (q) {
    const solved = team.points[q] && team.points[q].solvedAt;
    return solved ? '<span class="on">★</span>' : '<span class="off">☆</span>';
  }).join("");

  document.getElementById("pageTitle").textContent = puzzle.title;

  // 初めての正解直後だけ「ゲット演出」、再訪時は「解除済み」の確認表示にする
  function showSolved(justSolved) {
    document.getElementById("puzzleCard").hidden = true;
    document.getElementById("keyNumber").textContent = puzzle.keyNumber;
    document.getElementById("keyLead").textContent = justSolved
      ? "─ 封印の鍵 " + p + " を手に入れた ─"
      : "─ この封印は解除ずみ ─";
    document.getElementById("keyNote").textContent = justSolved
      ? "この数字は最後の扉で使うよ。忘れないようにメモしてね！"
      : "鍵の数字と在り処謎を、いつでもここで見返せるよ。";
    document.getElementById("solvedCard").hidden = false;
    // 在り処謎の画像（ファイルがまだ無ければ自動で非表示）
    if (puzzle.arikaImage) {
      const aimg = document.createElement("img");
      aimg.src = puzzle.arikaImage;
      aimg.alt = "在り処謎の画像";
      aimg.onerror = function () { this.remove(); };
      document.getElementById("arikaImageBox").appendChild(aimg);
    }
    document.getElementById("arikaCard").hidden = false;
    document.getElementById("backHome").hidden = isDebug; // デバッグ時はチームが無いのでホームに戻れない
  }

  // すでに正解済みなら、鍵と在り処謎を「解除済み」表示でそのまま見せる
  if (state.solvedAt) {
    showSolved(false);
    return;
  }

  // ---------- 鍵謎の表示 ----------
  document.getElementById("puzzleCard").hidden = false;
  document.getElementById("puzzleTitle").textContent = puzzle.title + " 〜鍵謎〜";
  document.getElementById("placeName").textContent = "場所：" + puzzle.place;

  const qEl = document.getElementById("question");
  qEl.textContent = puzzle.question;
  if (puzzle.image) {
    const img = document.createElement("img");
    img.src = puzzle.image;
    img.alt = "謎の画像";
    qEl.appendChild(img);
  }

  if (!state.firstViewedAt) {
    state.firstViewedAt = new Date().toISOString();
    if (!isDebug) Store.save(team);
  }

  const hintBox = document.getElementById("hintBox");
  const hintBtn = document.getElementById("hintBtn");

  function showHint() {
    document.getElementById("hintText").textContent = puzzle.smallHint;
    hintBox.hidden = false;
    hintBtn.hidden = true;
  }

  hintBtn.addEventListener("click", function () {
    showHint();
    if (!state.hintClicked) {
      state.hintClicked = true;
      if (!isDebug) Store.save(team);
    }
    if (!isDebug) Store.send(team, "hint_click", p, {});
  });

  const elapsedMs = Date.now() - new Date(state.firstViewedAt).getTime();
  const remainMs = CONFIG.AUTO_HINT_SECONDS * 1000 - elapsedMs;

  function autoHint() {
    if (!hintBox.hidden) return;
    showHint();
    if (!state.hintAutoShown) {
      state.hintAutoShown = true;
      if (!isDebug) {
        Store.save(team);
        Store.send(team, "hint_auto", p, {});
      }
    }
  }

  if (!isDebug) {
    if (state.hintAutoShown || remainMs <= 0) {
      autoHint();
    } else {
      setTimeout(autoHint, remainMs);
    }
  }

  // ---------- 4択 ----------
  const choicesEl = document.getElementById("choices");
  const feedback = document.getElementById("feedback");

  puzzle.choices.forEach(function (text, i) {
    const btn = document.createElement("button");
    btn.className = "choice";
    const abc = document.createElement("span");
    abc.className = "abc";
    abc.textContent = "ABCD"[i];
    const label = document.createElement("span");
    label.textContent = text;
    btn.appendChild(abc);
    btn.appendChild(label);
    btn.addEventListener("click", function () {
      if (state.solvedAt) return;
      if (i === puzzle.answerIndex) {
        btn.classList.add("right");
        feedback.className = "feedback ok";
        feedback.textContent = "正解──封印がひとつ、ほどけた。";
        // 魔法陣が展開して封印が解ける演出
        const c = FX.centerOf(btn);
        FX.burst({ x: c.x, y: c.y, count: 12 });
        FX.circle();
        state.solvedAt = new Date().toISOString();
        if (!isDebug) {
          Store.save(team);
          Store.send(team, "correct", p, { wrongCount: state.wrong });
        }
        setTimeout(function () { showSolved(true); }, 1400);
      } else {
        btn.classList.add("wrong");
        setTimeout(function () { btn.classList.remove("wrong"); }, 450);
        feedback.className = "feedback ng";
        feedback.textContent = "あれれ？ちがうみたい……もう一度考えてみて！";
        state.wrong += 1;
        if (!isDebug) {
          Store.save(team);
          Store.send(team, "wrong", p, { choice: i });
        }
      }
    });
    choicesEl.appendChild(btn);
  });
})();
</script>
</body>
</html>
