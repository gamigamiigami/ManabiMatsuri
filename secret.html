<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/zoom-fix.js"></script>
<title>最後の謎 ― 学校の秘密 | O中の封印を解け！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body.secret-page {
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(245, 196, 81, 0.10), transparent 60%),
      linear-gradient(178deg, #0b0a14 0%, #060610 55%, #020208 100%);
  }
  body.secret-page .vignette {
    background: radial-gradient(ellipse 120% 90% at 50% 40%, transparent 38%, rgba(0, 0, 0, 0.82) 100%);
  }

  #secretCard { border-color: #4a3b20; box-shadow: 0 24px 55px rgba(0, 0, 0, 0.7), 0 0 40px rgba(245, 196, 81, 0.12), inset 0 0 46px rgba(245, 196, 81, 0.05); }
  #secretCard h2 { background: linear-gradient(135deg, #f5d78a, #e0a83c); color: #2a1d05; }

  .secret-lead { text-align: center; font-family: "Yuji Syuku", serif; font-size: 1rem; color: var(--text-dim); margin-bottom: 18px; line-height: 1.9; }

  /* ===== 扉の向こうから聞こえるXの声 =====
     ここは手紙ではないので、便箋（.letter）を使わず、
     暗がりに浮かぶ声として見せる。 */
  .voice-msg {
    white-space: pre-wrap;
    font-family: "Shippori Mincho B1", serif;
    font-size: 0.95rem;
    line-height: 2.25;
    color: #ece4f6;
    text-shadow: 0 0 18px rgba(155, 127, 232, 0.35);
    padding: 4px 2px;
  }
  .voice-msg.small { font-size: 0.92rem; line-height: 2.1; color: #ded6ea; margin-bottom: 14px; }

  /* ===== 封印を解く手順（2つの指示文） ===== */
  .spell-box {
    margin: 4px 0 6px;
    padding: 18px 12px;
    border: 1px solid rgba(245, 196, 81, 0.4);
    border-radius: 10px;
    background: rgba(245, 196, 81, 0.05);
  }
  .spell-line {
    font-family: "Yuji Syuku", serif;
    /* 1行が折り返さない大きさに収める（18文字＋丸数字） */
    font-size: clamp(0.78rem, 3.7vw, 1rem);
    line-height: 2.3;
    text-align: center;
    white-space: nowrap;
    color: #f4ead6;
    text-shadow: 0 0 14px rgba(245, 196, 81, 0.4);
  }
  .spell-line.done { color: #7bd6ae; text-shadow: 0 0 14px rgba(75, 191, 156, 0.45); }
  .spell-line.done::after { content: " ✔"; }

  /* ===== 月を落とす魔法陣 ===== */
  .circle-target {
    position: relative;
    width: 210px; height: 210px;
    margin: 18px auto 6px;
  }
  .circle-target svg { display: block; width: 100%; height: 100%; }
  .circle-target .core {
    position: absolute; left: 50%; top: 50%;
    width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(245, 196, 81, 0.35) inset;
    transition: box-shadow 0.2s, background 0.2s;
  }
  .circle-target.hot .core {
    background: radial-gradient(circle, rgba(245, 196, 81, 0.35), transparent 70%);
    box-shadow: 0 0 26px 8px rgba(245, 196, 81, 0.35);
  }
  .circle-target.filled svg { opacity: 0.35; }
  /* 月が溶けたあと、中心に残る光 */
  .circle-target.moonlit .core {
    background: radial-gradient(circle, rgba(245, 225, 180, 0.30), transparent 72%);
    box-shadow: 0 0 30px 10px rgba(245, 196, 81, 0.22);
    animation: coreBreathe 3.6s ease-in-out infinite;
  }
  @keyframes coreBreathe {
    0%, 100% { box-shadow: 0 0 24px 8px rgba(245, 196, 81, 0.18); }
    50%      { box-shadow: 0 0 40px 14px rgba(245, 196, 81, 0.34); }
  }
  .circle-caption { text-align: center; font-size: 0.82rem; color: var(--text-dim); margin-top: -2px; }

  /* ===== ギミック層：月と「鍵」をカードより前に出すための入れ物 =====
     .scene は pointer-events:none で z-index も 0 のため、
     中に置いたままではタップもドラッグもできず、カードの裏に隠れてしまう。
     armGimmicks() でこの層へ移し替える。 */
  #gimmickLayer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }

  /* 動かせるようになった月（見た目は css/style.css の .scene .moon に合わせてある） */
  #gimmickLayer .moon-free {
    position: fixed;
    width: 96px; height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #f3ead6, #d9c497 55%, #a98f66 100%);
    filter: saturate(0.85);
    opacity: 0.92;
    box-shadow:
      0 0 44px 14px rgba(210, 190, 150, 0.30),
      0 0 130px 55px rgba(155, 127, 232, 0.16);
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
    animation: moonBeckon 2.4s ease-in-out infinite;
  }
  #gimmickLayer .moon-free.dragging { cursor: grabbing; animation: none; transition: none; }
  #gimmickLayer .moon-free.settled { animation: none; cursor: default; pointer-events: none; }
  @keyframes moonBeckon {
    0%, 100% { box-shadow: 0 0 44px 14px rgba(210, 190, 150, 0.30), 0 0 130px 55px rgba(155, 127, 232, 0.16); }
    50%      { box-shadow: 0 0 58px 20px rgba(245, 196, 81, 0.45), 0 0 150px 60px rgba(155, 127, 232, 0.22); }
  }

  /* 魔法陣に溶けて消える月（一度消えたら、もう二度と出さない） */
  #gimmickLayer .moon-free.vanishing {
    animation: moonVanish 2.2s ease-in forwards;
    pointer-events: none;
  }
  @keyframes moonVanish {
    0%   { opacity: 0.92; transform: scale(1);    filter: saturate(0.85); }
    22%  { opacity: 1;    transform: scale(1.18); filter: saturate(1.2) brightness(1.7); }
    100% { opacity: 0;    transform: scale(0.22); filter: brightness(2.2) blur(7px); }
  }

  /* 消滅・破裂のときに飛び散る光の粒 */
  #gimmickLayer .spark {
    position: fixed;
    width: 6px; height: 6px; border-radius: 50%;
    pointer-events: none; opacity: 0;
    animation: sparkFly var(--dur, 1.6s) ease-out forwards;
  }
  @keyframes sparkFly {
    0%   { opacity: 0;   transform: translate(-50%, -50%) scale(0.4); }
    18%  { opacity: 1; }
    100% { opacity: 0;   transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.9); }
  }

  /* たたける「鍵」。runeRise は css/style.css で定義済み */
  #gimmickLayer .key-rune {
    position: absolute;
    left: 46%; bottom: -60px;
    font-family: var(--brush);
    font-size: 2.4rem;
    color: rgba(212, 175, 106, 0.75);
    text-shadow: 0 0 18px rgba(212, 175, 106, 0.8);
    animation: runeRise 26s linear infinite;
    pointer-events: auto;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    padding: 10px;   /* 指で当てやすいように、見た目より広く取る */
  }
  #gimmickLayer .key-rune.hit { animation: runeRise 26s linear infinite, keyPulse 0.45s ease-out; }
  @keyframes keyPulse {
    0%   { text-shadow: 0 0 18px rgba(212, 175, 106, 0.8); }
    40%  { text-shadow: 0 0 40px rgba(255, 235, 180, 1), 0 0 70px rgba(245, 196, 81, 0.8); }
    100% { text-shadow: 0 0 18px rgba(212, 175, 106, 0.8); }
  }
  #gimmickLayer .key-rune.spent { pointer-events: none; opacity: 0; }

  /* 三度目に触れたとき、「鍵」がふくらんで弾ける */
  #gimmickLayer .key-burst {
    position: fixed;
    font-family: var(--brush);
    font-size: 2.4rem;
    color: #fff7e2;
    pointer-events: none;
    animation: keyBurst 1.5s ease-out forwards;
  }
  @keyframes keyBurst {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(1);
           text-shadow: 0 0 20px rgba(245, 196, 81, 0.9); }
    28%  { opacity: 1; transform: translate(-50%, -50%) scale(1.7);
           text-shadow: 0 0 60px #fff, 0 0 110px rgba(245, 196, 81, 1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(4.4);
           text-shadow: 0 0 90px rgba(245, 196, 81, 0); }
  }

  /* たたいた回数 */
  .tap-count { text-align: center; font-family: "Yuji Syuku", serif; color: var(--gold); font-size: 0.95rem; letter-spacing: 0.3em; }

  /* ===== 現れた謎 ===== */
  .puzzle-lead { text-align: center; font-family: "Yuji Syuku", serif; color: var(--gold); font-size: 0.98rem; margin-bottom: 12px; }
  .puzzle-body { white-space: pre-wrap; line-height: 1.95; font-size: 0.95rem; }
  .puzzle-img { display: block; width: 100%; border-radius: 8px; margin: 14px 0 4px; }

  /* ===== 合言葉の入力欄 ===== */
  .word-row { max-width: 340px; margin: 0 auto 14px; }
  .word-row label {
    display: block; margin-bottom: 6px;
    font-family: "Yuji Syuku", serif; font-size: 0.9rem; color: var(--gold);
    letter-spacing: 0.08em;
  }
  .word-plus {
    text-align: center; color: var(--gold); font-size: 1.3rem;
    margin: -4px 0 10px; opacity: 0.7;
  }
  input.word-input {
    display: block; width: 100%; max-width: 340px; margin: 0 auto;
    padding: 14px 16px;
    border: 1px solid rgba(245, 196, 81, 0.45); border-radius: 8px;
    background: rgba(255, 255, 255, 0.94);
    color: #1b1420;
    font-family: "Shippori Mincho B1", serif;
    font-size: 1.35rem; letter-spacing: 0.18em; text-align: center;
  }
  input.word-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245, 196, 81, 0.22); }

  /* クリア時のことば（final.html の同名クラスに合わせた見た目） */
  .success-msg {
    text-align: center; font-family: "Yuji Syuku", serif;
    font-size: 1.05rem; line-height: 2.1; white-space: pre-wrap;
    color: #f4ead6; text-shadow: 0 0 14px rgba(245, 196, 81, 0.35);
  }

  #hintText, #gimmickHintText { white-space: pre-line; }
</style>
</head>
<body class="secret-page">
<div class="scene" aria-hidden="true">
  <div class="moon" id="moon"></div>
  <div class="fog fog1"></div>
  <div class="fog fog2"></div>
  <div class="fog fog3"></div>
  <div class="runes">
    <span>秘</span><span>密</span><span>親</span><span>子</span><span>学</span><span>校</span><span>成</span><span>長</span><span>封</span><span>解</span><span>謎</span><span>光</span><span>扉</span><span>答</span>
  </div>
  <div class="vignette"></div>
</div>
<div class="wrap">
  <header class="site">
    <div class="subtitle">転校生Xからの最後の挑戦</div>
    <h1>学校の秘密</h1>
    <div class="ornament">✦ ─── ◆ ─── ✦</div>
  </header>

  <!-- デバッグ表示中バナー（?debug=1 のときだけ表示。記録は一切送信されない） -->
  <div class="card debug-banner" id="debugBanner" hidden>
    <p>🔧 デバッグ表示中（チーム未登録・記録されません）</p>
  </div>

  <!-- 扉の謎がまだのとき -->
  <section class="card" id="lockedCard" hidden>
    <h2>まだその先は見えない</h2>
    <p class="note center">Xの部屋の扉を開けるまで、この謎は姿を現さない。</p>
    <a class="btn" href="final.html">扉の謎へ向かう</a>
  </section>

  <!-- Xのことば（手紙ではなく、扉の向こうから聞こえてくる声） -->
  <section class="card" id="introCard" hidden>
    <h2>扉の向こうの声</h2>
    <div class="voice-msg" id="secretLetter"></div>
  </section>

  <!-- 封印を解く手順（2つの指示文）＋ 月を落とす魔法陣 -->
  <section class="card" id="spellCard" hidden>
    <h2>封印を解く手順</h2>
    <div class="voice-msg small" id="handoffMsg"></div>
    <div class="spell-box">
      <div class="spell-line" id="spell1"></div>
      <div class="spell-line" id="spell2"></div>
    </div>

    <div class="circle-target" id="moonTarget">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <g fill="none" stroke="rgba(245,196,81,0.5)" stroke-width="1">
          <circle cx="100" cy="100" r="94"/>
          <circle cx="100" cy="100" r="86"/>
          <circle cx="100" cy="100" r="52"/>
          <circle cx="100" cy="100" r="26"/>
          <polygon points="100,14 174.5,143 25.5,143"/>
          <polygon points="100,186 25.5,57 174.5,57"/>
        </g>
        <g fill="rgba(245,196,81,0.35)" font-family="serif" font-size="10" text-anchor="middle">
          <text x="100" y="10">ᚠ</text><text x="164" y="46">ᚦ</text><text x="190" y="104">ᚱ</text>
          <text x="164" y="162">ᚷ</text><text x="100" y="198">ᚺ</text><text x="36" y="162">ᛁ</text>
          <text x="10" y="104">ᛇ</text><text x="36" y="46">ᛉ</text>
        </g>
      </svg>
      <div class="core" id="circleCore"></div>
    </div>
    <p class="circle-caption" id="circleCaption">魔法陣の中心が、何かを待っている。</p>

    <div class="tap-count" id="tapCount" hidden></div>

    <div class="hint-box" id="gimmickHintBox" hidden>
      <span class="tag">⚠ 手がかり</span>
      <div id="gimmickHintText"></div>
    </div>
    <button class="btn ghost small" id="gimmickHintBtn" style="margin-top:14px;">⚠ 指示文の意味がわからないときは</button>
  </section>

  <!-- 現れた謎（①月・②鍵） -->
  <section class="card" id="puzzleCard1" hidden>
    <h2 id="puzzleTitle1"></h2>
    <div class="puzzle-lead" id="puzzleLead1"></div>
    <img class="puzzle-img" id="puzzleImg1" hidden alt="">
    <div class="puzzle-body" id="puzzleBody1"></div>
    <a class="btn ghost small" id="puzzleLink1" hidden style="margin-top:14px;"></a>
  </section>

  <section class="card" id="puzzleCard2" hidden>
    <h2 id="puzzleTitle2"></h2>
    <div class="puzzle-lead" id="puzzleLead2"></div>
    <img class="puzzle-img" id="puzzleImg2" hidden alt="">
    <div class="puzzle-body" id="puzzleBody2"></div>
    <a class="btn ghost small" id="puzzleLink2" hidden style="margin-top:14px;"></a>
  </section>

  <!-- 合言葉の入力（2つの謎が現れてから） -->
  <section class="card" id="secretCard" hidden>
    <h2>最後の謎</h2>
    <p class="secret-lead">きみたちを大きくしてくれる、<br>「学校の秘密」を答えよ。</p>

    <div class="digits-hint">ふたつの合言葉を入力せよ</div>
    <div class="word-row">
      <label for="word1" id="word1Label"></label>
      <input type="text" class="word-input" id="word1" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="　　　　">
    </div>
    <div class="word-plus">＋</div>
    <div class="word-row">
      <label for="word2" id="word2Label"></label>
      <input type="text" class="word-input" id="word2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="　　　　">
    </div>

    <button class="btn gold" id="submitBtn" style="margin-top:16px;">封印に言葉をきざむ</button>
    <div class="feedback" id="feedback"></div>

    <div class="hint-box" id="hintBox" hidden>
      <span class="tag">⚠ 手がかり</span>
      <div id="hintText"></div>
    </div>
    <button class="btn ghost small" id="hintBtn" style="margin-top:14px;">⚠ 手がかりを見る</button>
    <p class="note">どうしても解けないときは、近くのスタッフに声をかけてね。</p>
    <a class="btn ghost small" href="index.html" style="margin-top:10px;">← ホームに戻る</a>
  </section>

  <!-- クリア -->
  <section class="card" id="clearCard" hidden>
    <h2>封印、解ける</h2>
    <div class="success-msg" id="secretSuccessMsg"></div>
    <div class="letter" id="epilogueLetter" data-decor="preset:letterSecret" style="margin-top:18px;"></div>
  </section>

  <div id="backHome" hidden>
    <a class="btn" href="index.html">進捗を見る（ホームへ）</a>
  </div>

  <button class="btn ghost small" id="debugResetBtn" hidden style="max-width:480px; margin:20px auto 0; display:block;">（デバッグ）最後の謎を未解決に戻す</button>
</div>

<!-- 月と「鍵」をカードより前面に出すための層（中身は JS が入れる） -->
<div id="gimmickLayer"></div>

<script src="js/config.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/letter-decor.js"></script>
<script src="js/letter-fixed.js"></script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script>
(function () {
  const isDebug = new URLSearchParams(location.search).get("debug") === "1" && CONFIG.DEBUG_ENABLED;
  if (isDebug) {
    document.getElementById("debugBanner").hidden = false;
    document.getElementById("debugResetBtn").hidden = false;
  }

  const team = Store.load();
  if (!team) {
    location.replace("index.html");
    return;
  }

  // 扉の謎（final.html）を解いていないと、この画面には入れない
  const doorCleared = !!(team.finalGate && team.finalGate.solvedAt);
  if (!doorCleared && !isDebug) {
    document.getElementById("lockedCard").hidden = false;
    return;
  }

  const st = (function () {
    if (!team.secretGate) team.secretGate = {};
    const g = team.secretGate;
    if (g.solvedAt === undefined) g.solvedAt = null;
    if (g.wrong === undefined) g.wrong = 0;
    if (g.hintClicked === undefined) g.hintClicked = false;
    if (g.foundMoon === undefined) g.foundMoon = false;  // ①月を魔法陣へ
    if (g.foundKey === undefined) g.foundKey = false;    // ②「鍵」を3回たたく
    return g;
  })();
  function persist() { if (!isDebug) Store.save(team); }

  // 月は魔法陣に溶けて消えたきり、もう二度と姿を見せない。
  // （クリア後にこの画面へ戻ってきたときも出さないので、armGimmicks の外で消す）
  if (st.foundMoon) {
    const oldMoon = document.getElementById("moon");
    if (oldMoon) oldMoon.remove();
  }

  // 光の粒をまき散らす（月の消滅・鍵の破裂で使う）
  function spawnSparks(x, y, color, count, spread) {
    const layer = document.getElementById("gimmickLayer");
    for (let i = 0; i < count; i++) {
      const s = document.createElement("i");
      const a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const d = spread * (0.55 + Math.random() * 0.65);
      s.className = "spark";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.background = color;
      s.style.boxShadow = "0 0 10px " + color;
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", (Math.sin(a) * d - spread * 0.35) + "px");
      s.style.setProperty("--dur", (1.2 + Math.random() * 0.9).toFixed(2) + "s");
      layer.appendChild(s);
      setTimeout(function () { s.remove(); }, 2400);
    }
  }

  document.getElementById("secretLetter").textContent = SECRET_CHALLENGE_MESSAGE;
  document.getElementById("handoffMsg").textContent = SECRET_HANDOFF_MESSAGE;
  document.getElementById("epilogueLetter").textContent = EPILOGUE;
  document.getElementById("secretSuccessMsg").textContent = SECRET_SUCCESS_MESSAGE;
  document.getElementById("spell1").textContent = SECRET_INSTRUCTIONS[0];
  document.getElementById("spell2").textContent = SECRET_INSTRUCTIONS[1];
  document.getElementById("word1Label").textContent = SECRET_WORDS[0].label;
  document.getElementById("word2Label").textContent = SECRET_WORDS[1].label;

  // 現れた謎をカードに流し込む
  function fillPuzzle(n, def) {
    document.getElementById("puzzleTitle" + n).textContent = def.title;
    document.getElementById("puzzleLead" + n).textContent = def.lead;
    document.getElementById("puzzleBody" + n).textContent = def.body;
    if (def.image) {
      const img = document.getElementById("puzzleImg" + n);
      img.src = def.image; img.hidden = false;
    }
    if (def.link) {
      const a = document.getElementById("puzzleLink" + n);
      a.href = def.link.href; a.textContent = def.link.label; a.hidden = false;
    }
    document.getElementById("puzzleCard" + n).hidden = false;
  }

  // 2つとも見つかったら合言葉の入力欄を出す
  function refresh() {
    document.getElementById("spell1").classList.toggle("done", st.foundMoon);
    document.getElementById("spell2").classList.toggle("done", st.foundKey);
    if (st.foundMoon) fillPuzzle(1, SECRET_PUZZLES.moon);
    if (st.foundKey) fillPuzzle(2, SECRET_PUZZLES.key);
    document.getElementById("secretCard").hidden = !(st.foundMoon && st.foundKey);
  }

  if (st.solvedAt) {
    showClear();
  } else {
    document.getElementById("introCard").hidden = false;
    document.getElementById("spellCard").hidden = false;
    refresh();
    armGimmicks();
  }

  // ============================================================
  // ギミック①：月を魔法陣の中心へドラッグする
  // ギミック②：漂う「鍵」を3回たたく
  //
  // どちらの対象も .scene の中にあるが、.scene は pointer-events:none で
  // z-index も 0 のため、そのままでは触れないしカードの裏に隠れる。
  // かといって .scene 全体を前面に出すと、霧やビネットがカードを覆って
  // しまう。そこで対象だけを #gimmickLayer に移し替える。
  // ============================================================
  function armGimmicks() {
    const layer = document.getElementById("gimmickLayer");

    // すでに月を落としたあとに開き直した場合は、魔法陣だけ光らせておく
    if (st.foundMoon) {
      document.getElementById("moonTarget").classList.add("filled", "moonlit");
      document.getElementById("circleCaption").textContent = "月は魔法陣に溶け、光だけが残った。";
    }

    // ---- ① 月 ----
    if (!st.foundMoon) {
      const moon = document.getElementById("moon");
      const r = moon.getBoundingClientRect();
      moon.className = "moon-free";
      moon.style.left = r.left + "px";
      moon.style.top = r.top + "px";
      layer.appendChild(moon);

      const target = document.getElementById("moonTarget");
      const core = document.getElementById("circleCore");
      let dragging = false, grabX = 0, grabY = 0;

      function centreOf(el) {
        const b = el.getBoundingClientRect();
        return { x: b.left + b.width / 2, y: b.top + b.height / 2 };
      }
      function distToCore() {
        const m = centreOf(moon), c = centreOf(core);
        return Math.hypot(m.x - c.x, m.y - c.y);
      }

      moon.addEventListener("pointerdown", function (e) {
        dragging = true;
        moon.classList.add("dragging");
        moon.setPointerCapture(e.pointerId);
        const b = moon.getBoundingClientRect();
        grabX = e.clientX - b.left;
        grabY = e.clientY - b.top;
        e.preventDefault();
      });

      moon.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        moon.style.left = (e.clientX - grabX) + "px";
        moon.style.top = (e.clientY - grabY) + "px";
        // 中心に近づいたら魔法陣が光る
        target.classList.toggle("hot", distToCore() < 60);
        // 画面外に出そうなときは魔法陣まで自動でスクロール
        const b = target.getBoundingClientRect();
        if (b.bottom > window.innerHeight - 40) window.scrollBy(0, 8);
        else if (b.top < 80) window.scrollBy(0, -8);
        e.preventDefault();
      });

      function drop(e) {
        if (!dragging) return;
        dragging = false;
        moon.classList.remove("dragging");
        target.classList.remove("hot");
        if (distToCore() < 60) {
          // 中心にぴったり収める
          const c = centreOf(core), b = moon.getBoundingClientRect();
          moon.style.transition = "left .25s ease, top .25s ease";
          moon.style.left = (c.x - b.width / 2) + "px";
          moon.style.top = (c.y - b.height / 2) + "px";
          moon.classList.add("settled");
          target.classList.add("filled");
          document.getElementById("circleCaption").textContent = "月が、魔法陣の中心に満ちた。";
          if (window.FX && FX.circle) FX.circle();
          st.foundMoon = true;
          persist();
          if (!isDebug) Store.send(team, "secret_moon", "secret", {});

          // 中心に収まったあと、月はゆっくり溶けて消える（以後もう出さない）
          setTimeout(function () {
            const m = centreOf(moon);
            moon.classList.add("vanishing");
            spawnSparks(m.x, m.y, "rgba(247, 232, 196, 0.95)", 16, 95);
            target.classList.add("moonlit");
            document.getElementById("circleCaption").textContent = "月は魔法陣に溶け、光だけが残った。";
            setTimeout(function () { moon.remove(); }, 2400);
          }, 700);

          setTimeout(function () {
            refresh();
            document.getElementById("puzzleCard1").scrollIntoView({ behavior: "smooth", block: "start" });
          }, 1900);
        }
        if (e && e.pointerId !== undefined && moon.hasPointerCapture(e.pointerId)) {
          moon.releasePointerCapture(e.pointerId);
        }
      }
      moon.addEventListener("pointerup", drop);
      moon.addEventListener("pointercancel", drop);
    }

    // ---- ②「鍵」 ----
    if (!st.foundKey) {
      const rune = document.createElement("span");
      rune.className = "key-rune";
      rune.textContent = "鍵";
      layer.appendChild(rune);

      const counter = document.getElementById("tapCount");
      let taps = 0;

      rune.addEventListener("click", function () {
        // 消えかけ・出る前のタイミングでは反応させない（見えている文字だけ）
        const op = parseFloat(getComputedStyle(rune).opacity);
        if (op < 0.25) return;

        taps += 1;
        rune.classList.remove("hit");
        void rune.offsetWidth;   // アニメーションを撒き直す
        rune.classList.add("hit");

        if (taps < 3) {
          counter.hidden = false;
          counter.textContent = "鍵に触れた … " + taps + " / 3";
          return;
        }
        // 三度目 ―― 「鍵」がその場でふくらんで弾ける
        counter.hidden = true;
        const b = rune.getBoundingClientRect();
        const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
        rune.classList.add("spent");

        const burst = document.createElement("span");
        burst.className = "key-burst";
        burst.textContent = "鍵";
        burst.style.left = cx + "px";
        burst.style.top = cy + "px";
        layer.appendChild(burst);
        spawnSparks(cx, cy, "rgba(255, 236, 190, 0.95)", 20, 130);
        setTimeout(function () { burst.remove(); rune.remove(); }, 1700);

        if (window.FX && FX.circle) FX.circle();
        st.foundKey = true;
        persist();
        if (!isDebug) Store.send(team, "secret_key", "secret", {});
        setTimeout(function () {
          refresh();
          document.getElementById("puzzleCard2").scrollIntoView({ behavior: "smooth", block: "start" });
        }, 1200);
      });
    }
  }

  document.getElementById("gimmickHintBtn").addEventListener("click", function () {
    document.getElementById("gimmickHintText").textContent = SECRET_GIMMICK_HINT;
    document.getElementById("gimmickHintBox").hidden = false;
  });

  document.getElementById("debugResetBtn").addEventListener("click", function () {
    team.secretGate = null;
    Store.save(team);
    location.reload();
  });

  document.getElementById("hintBtn").addEventListener("click", function () {
    document.getElementById("hintText").textContent = SECRET_HINT;
    document.getElementById("hintBox").hidden = false;
    if (!st.hintClicked) {
      st.hintClicked = true;
      persist();
      if (!isDebug) Store.send(team, "secret_hint", "secret", {});
    }
  });

  const inputs = [document.getElementById("word1"), document.getElementById("word2")];
  const feedback = document.getElementById("feedback");
  const secretCard = document.getElementById("secretCard");

  inputs.forEach(function (el, i) {
    el.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      // 1つめで Enter → 2つめへ。2つめで Enter → 送信
      if (i < inputs.length - 1) inputs[i + 1].focus();
      else document.getElementById("submitBtn").click();
    });
  });

  document.getElementById("submitBtn").addEventListener("click", function () {
    const words = inputs.map(function (el) { return el.value; });
    if (words.some(function (w) { return !w.trim(); })) {
      feedback.className = "feedback ng";
      feedback.textContent = "合言葉をふたつとも入力してね。";
      return;
    }
    if (checkSecretAnswers(words)) {
      st.solvedAt = new Date().toISOString();
      persist();
      if (!isDebug) Store.send(team, "secret_correct", "secret", {});
      feedback.className = "feedback ok";
      feedback.textContent = "――言葉が、光になった。";
      if (window.FX && FX.circle) FX.circle();
      setTimeout(showClear, 1400);
    } else {
      st.wrong += 1;
      persist();
      if (!isDebug) Store.send(team, "secret_wrong", "secret", { words: words.join(" / ") });
      feedback.className = "feedback ng";
      // 片方だけ合っているときは、そこまで来ていることを伝える
      const hits = words.filter(function (w) { return matchSecretWord(w) >= 0; }).length;
      feedback.textContent = hits === 1
        ? "……片方は合ってる。もうひとつは？"
        : "……ちがう。それはぼくも試した。";
      secretCard.classList.add("lock-shake");
      setTimeout(function () { secretCard.classList.remove("lock-shake"); }, 500);
      inputs[0].select();
    }
  });

  function showClear() {
    ["introCard", "spellCard", "puzzleCard1", "puzzleCard2", "secretCard"].forEach(function (id) {
      document.getElementById(id).hidden = true;
    });
    document.getElementById("clearCard").hidden = false;
    document.getElementById("backHome").hidden = false;
  }
})();
</script>
</body>
