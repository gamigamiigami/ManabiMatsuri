<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=10.0, user-scalable=yes">
<script src="js/zoom-fix.js"></script>
<title>完全制覇 | 応中の封印を解け！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body.complete-page {
    background:
      radial-gradient(ellipse 90% 50% at 50% 0%, rgba(212, 175, 106, 0.14), transparent 62%),
      radial-gradient(ellipse 70% 45% at 12% 85%, rgba(155, 127, 232, 0.16), transparent 60%),
      radial-gradient(ellipse 70% 45% at 90% 90%, rgba(75, 191, 156, 0.10), transparent 60%),
      linear-gradient(178deg, #0c0714 0%, #12081f 45%, #070510 100%);
  }
  body.complete-page .vignette {
    background: radial-gradient(ellipse 120% 90% at 50% 30%, transparent 40%, rgba(0, 0, 0, 0.78) 100%);
  }

  /* ===== 認定状カード ===== */
  #certCard {
    border: 1.5px solid var(--gold);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 60px rgba(212, 175, 106, 0.18), inset 0 0 50px rgba(212, 175, 106, 0.06);
    text-align: center;
  }
  #certCard h2 { background: linear-gradient(135deg, #fdf3da, var(--gold)); }

  .cert-badge {
    width: 108px; height: 108px; margin: 4px auto 10px;
    filter: drop-shadow(0 0 22px rgba(212, 175, 106, 0.55));
    animation: certSpin 2.2s cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
  }
  @keyframes certSpin {
    0% { opacity: 0; transform: scale(0.3) rotate(-30deg); }
    55% { opacity: 1; transform: scale(1.12) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .cert-eyebrow {
    font-family: var(--serif);
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    opacity: 0.85;
    margin-bottom: 2px;
  }
  .cert-title {
    font-family: var(--brush);
    font-size: 2.3rem;
    line-height: 1.3;
    background: linear-gradient(180deg, #fdf3da 15%, #ecca87 55%, #c99b4e 92%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 22px var(--gold-glow));
    margin: 2px 0 14px;
  }
  .cert-team {
    font-family: var(--serif);
    font-size: 1.15rem;
    color: var(--text);
    margin-bottom: 4px;
  }
  .cert-team b { color: var(--gold); }
  .cert-sub {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .cert-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--gold-deep); opacity: 0.7; font-size: 0.8rem;
    margin: 16px 0;
  }
  .cert-divider::before, .cert-divider::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
  }

  .cert-checklist { text-align: left; max-width: 340px; margin: 0 auto; }
  .cert-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 4px; font-size: 0.92rem; line-height: 1.6;
    border-bottom: 1px dashed rgba(212, 175, 106, 0.18);
  }
  .cert-row:last-child { border-bottom: none; }
  .cert-check {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #ecca87, var(--gold));
    color: #2c1c07; font-size: 0.8rem; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 10px rgba(212, 175, 106, 0.5);
  }
  .cert-row-label { color: var(--text); font-weight: 700; }
  .cert-row-detail { color: var(--text-dim); font-size: 0.82rem; margin-top: 2px; }

  .cert-keys-row { display: flex; justify-content: center; gap: 8px; margin: 4px 0 2px; }
  .cert-keys-row .k {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(160deg, #241735, #170f28);
    border: 1px solid rgba(212, 175, 106, 0.45);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 1rem; color: var(--gold);
    box-shadow: 0 0 8px rgba(212, 175, 106, 0.25);
  }

  .cert-secret-words { text-align: center; margin-top: 4px; }
  .cert-secret-words span {
    display: inline-block; font-family: var(--brush); font-size: 1.15rem;
    color: var(--gold); margin: 0 4px;
    text-shadow: 0 0 12px var(--gold-glow);
  }

  .cert-jump-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .cert-jump-list span {
    font-size: 0.76rem; color: var(--violet); background: rgba(155, 127, 232, 0.12);
    border: 1px solid rgba(155, 127, 232, 0.35); border-radius: 999px; padding: 3px 10px;
  }

  .cert-seal {
    margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(212, 175, 106, 0.2);
    font-family: var(--serif); font-size: 0.78rem; color: var(--text-dim);
    letter-spacing: 0.08em;
  }
  .cert-seal b { color: var(--gold); }

  .complete-actions { text-align: center; margin-top: 22px; }
</style>
</head>
<body class="complete-page">
<div class="scene" aria-hidden="true">
  <div class="moon"></div>
  <div class="fog fog1"></div>
  <div class="fog fog2"></div>
  <div class="fog fog3"></div>
  <div class="runes">
    <span>応</span><span>時</span><span>親</span><span>子</span><span>学</span><span>鍵</span><span>在</span><span>謎</span><span>封</span><span>解</span><span>鍵</span><span>封</span><span>解</span><span>謎</span>
  </div>
  <div class="vignette"></div>
</div>

<div class="wrap">
  <header class="site">
    <svg class="magic-circle mc-lit" viewBox="0 0 400 400" aria-hidden="true">
      <defs>
        <path id="glyphPath2" d="M200,200 m-160,0 a160,160 0 1,1 320,0 a160,160 0 1,1 -320,0"></path>
        <path id="wordPath2" d="M200,200 m-108,0 a108,108 0 1,1 216,0 a108,108 0 1,1 -216,0"></path>
      </defs>
      <g fill="none" stroke="#d4af6a">
        <circle cx="200" cy="200" r="194" stroke-width="1.6" opacity="0.9"></circle>
        <circle cx="200" cy="200" r="187" stroke-width="0.7" opacity="0.55"></circle>
        <circle cx="200" cy="200" r="140" stroke-width="1.1" opacity="0.8"></circle>
        <circle cx="200" cy="200" r="134" stroke-width="0.6" opacity="0.5"></circle>
        <polygon points="200,62 80.5,269 319.5,269" stroke-width="1.3" opacity="0.7"></polygon>
        <polygon points="200,338 80.5,131 319.5,131" stroke-width="1.3" opacity="0.7"></polygon>
        <circle cx="200" cy="200" r="56" stroke-width="1" opacity="0.75"></circle>
        <circle cx="200" cy="200" r="50" stroke-width="0.6" opacity="0.5"></circle>
      </g>
      <g fill="none" stroke="#9b7fe8" opacity="0.85">
        <circle cx="200" cy="62" r="13" stroke-width="1.1"></circle>
        <circle cx="80.5" cy="269" r="13" stroke-width="1.1"></circle>
        <circle cx="319.5" cy="269" r="13" stroke-width="1.1"></circle>
        <circle cx="200" cy="338" r="13" stroke-width="1.1"></circle>
        <circle cx="80.5" cy="131" r="13" stroke-width="1.1"></circle>
        <circle cx="319.5" cy="131" r="13" stroke-width="1.1"></circle>
      </g>
      <g fill="#9b7fe8" opacity="0.9" font-size="13" text-anchor="middle" font-family="'Shippori Mincho B1',serif">
        <text x="200" y="67">月</text>
        <text x="80.5" y="274">星</text>
        <text x="319.5" y="274">夜</text>
        <text x="200" y="343">影</text>
        <text x="80.5" y="136">風</text>
        <text x="319.5" y="136">灯</text>
      </g>
      <g class="mc-glyphs">
        <text font-size="14" fill="#d4af6a" opacity="0.8" letter-spacing="7">
          <textPath href="#glyphPath2">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛋ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ</textPath>
        </text>
      </g>
      <g class="mc-words">
        <text font-size="11" fill="#9b7fe8" opacity="0.75" letter-spacing="12" font-family="'Shippori Mincho B1',serif">
          <textPath href="#wordPath2">封じられし学び舎に　五つの鍵は眠る　月満ちる夜　扉は開かれん</textPath>
        </text>
      </g>
      <g fill="rgba(212,175,106,0.85)">
        <circle cx="200" cy="193" r="12"></circle>
        <path d="M194,201 L206,201 L211,222 L189,222 Z"></path>
      </g>
      <circle cx="200" cy="200" r="34" fill="none" stroke="rgba(212,175,106,0.5)" stroke-width="0.8" stroke-dasharray="3 5"></circle>
    </svg>
    <div class="subtitle">すべての謎を解き明かした者へ</div>
    <h1>完全制覇</h1>
    <div class="ornament">✦ ─── ◆ ─── ✦</div>
  </header>

  <!-- 未達成のまま直接開いた場合の案内（JSで出し分け） -->
  <section class="card" id="notYetCard" hidden>
    <h2>まだ早い</h2>
    <p class="note center" style="font-size:1rem; line-height:1.9;">この証は、本編もジャンプの謎も<br>すべて見つけ出したチームだけのもの。</p>
    <a class="btn gold" href="index.html" style="margin-top:14px;">→ 冒険記録（ホーム）へ戻る</a>
  </section>

  <!-- 完全制覇の証 -->
  <section class="card" id="certCard" hidden>
    <h2>認定状</h2>

    <svg class="cert-badge" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="#d4af6a">
        <circle cx="100" cy="100" r="92" stroke-width="1.4"/>
        <circle cx="100" cy="100" r="84" stroke-width="0.7" opacity="0.6"/>
        <polygon points="100,14 26,143 174,143" stroke-width="1"/>
        <polygon points="100,186 26,57 174,57" stroke-width="1"/>
      </g>
      <g fill="none" stroke="#9b7fe8" opacity="0.85">
        <circle cx="100" cy="100" r="62" stroke-width="0.9" stroke-dasharray="3 6"/>
      </g>
      <g fill="rgba(212,175,106,0.9)">
        <circle cx="100" cy="94" r="12"/>
        <path d="M94,102 L106,102 L111,123 L89,123 Z"/>
      </g>
    </svg>

    <div class="cert-eyebrow">C E R T I F I C A T E</div>
    <div class="cert-title">完全制覇</div>
    <div class="cert-team"><b id="certTeamName"></b> は</div>
    <div class="cert-sub">この学校に隠されたすべての謎を、見つけ出した。</div>

    <div class="cert-divider">achievements</div>

    <div class="cert-checklist">
      <div class="cert-row">
        <div class="cert-check">✓</div>
        <div>
          <div class="cert-row-label">5つの封印の鍵</div>
          <div class="cert-row-detail">
            <div class="cert-keys-row" id="certKeysRow"></div>
          </div>
        </div>
      </div>
      <div class="cert-row">
        <div class="cert-check">✓</div>
        <div>
          <div class="cert-row-label">Xの部屋の扉</div>
          <div class="cert-row-detail">封印の力を束ね、開放した</div>
        </div>
      </div>
      <div class="cert-row">
        <div class="cert-check">✓</div>
        <div>
          <div class="cert-row-label">学校の秘密</div>
          <div class="cert-row-detail">
            <div class="cert-secret-words" id="certSecretWords"></div>
          </div>
        </div>
      </div>
      <div class="cert-row">
        <div class="cert-check">✓</div>
        <div>
          <div class="cert-row-label" id="certJumpLabel">ジャンプの謎</div>
          <div class="cert-row-detail">
            <div class="cert-jump-list" id="certJumpList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="cert-seal">
      <b id="certDate"></b> ── 応中の封印、完全解除
    </div>
  </section>

  <!-- Xからの特別なことば -->
  <section class="card" id="letterCard" hidden>
    <h2>✉ Xより</h2>
    <div class="letter" id="completeLetter" data-decor="preset:letterComplete"></div>
  </section>

  <div class="complete-actions" id="completeActions" hidden>
    <a class="btn" href="index.html">冒険記録（ホーム）へ戻る</a>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/letter-decor.js"></script>
<script src="js/letter-fixed.js"></script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script>
(function () {
  const team = Store.load();

  function notYet() {
    document.getElementById("notYetCard").hidden = false;
  }

  if (!team) { notYet(); return; }

  const doorCleared = !!(team.finalGate && team.finalGate.solvedAt);
  const secretCleared = !!(team.secretGate && team.secretGate.solvedAt);
  const dummyCount = Store.dummySolvedCount(team);
  const fullClear = doorCleared && secretCleared && dummyCount >= DUMMY_TOTAL;

  if (!fullClear) { notYet(); return; }

  document.getElementById("certCard").hidden = false;
  document.getElementById("letterCard").hidden = false;
  document.getElementById("completeActions").hidden = false;

  document.getElementById("certTeamName").textContent = team.teamName || "冒険チーム";

  const keysRow = document.getElementById("certKeysRow");
  keysRow.innerHTML = POINT_ORDER.map(function (p) {
    return '<div class="k">' + PUZZLES[p].choices[PUZZLES[p].answerIndex] + "</div>";
  }).join("");

  document.getElementById("certSecretWords").innerHTML =
    SECRET_WORDS.map(function (w) { return "<span>" + w.answers[0] + "</span>"; }).join("×");

  document.getElementById("certJumpLabel").textContent = "ジャンプの謎（全" + DUMMY_TOTAL + "）";
  document.getElementById("certJumpList").innerHTML =
    Object.keys(DUMMY_PUZZLES).map(function (n) {
      return "<span>" + DUMMY_PUZZLES[n].title + "</span>";
    }).join("");

  const now = new Date();
  document.getElementById("certDate").textContent =
    now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日";

  document.getElementById("completeLetter").textContent = COMPLETE_MESSAGE;

  // 盛大な演出：中央のバーストを間隔をあけて3連発する
  FX.circle({ count: 22 });
  setTimeout(function () { FX.burst({ x: window.innerWidth * 0.25, y: window.innerHeight * 0.35, count: 16 }); }, 500);
  setTimeout(function () { FX.burst({ x: window.innerWidth * 0.75, y: window.innerHeight * 0.35, count: 16 }); }, 850);
})();
</script>
</body>
</html>
