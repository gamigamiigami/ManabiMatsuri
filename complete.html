<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=10.0, user-scalable=yes">
<script src="js/zoom-fix.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body.complete-page {
    background:
      radial-gradient(ellipse 95% 55% at 50% -4%, rgba(212, 175, 106, 0.22), transparent 60%),
      radial-gradient(ellipse 75% 50% at 8% 90%, rgba(155, 127, 232, 0.22), transparent 62%),
      radial-gradient(ellipse 75% 50% at 94% 94%, rgba(75, 191, 156, 0.16), transparent 62%),
      radial-gradient(ellipse 60% 40% at 90% 6%, rgba(207, 79, 104, 0.14), transparent 60%),
      linear-gradient(178deg, #0d0817 0%, #180b28 42%, #0a0512 100%);
    background-size: 140% 140%, 140% 140%, 140% 140%, 140% 140%, 100% 100%;
    animation: completeAurora 18s ease-in-out infinite alternate;
  }
  @keyframes completeAurora {
    0% { background-position: 0% 0%, 0% 100%, 100% 100%, 100% 0%, center; }
    100% { background-position: 8% 6%, 4% 92%, 92% 90%, 92% 8%, center; }
  }
  body.complete-page .vignette {
    background: radial-gradient(ellipse 120% 90% at 50% 30%, transparent 38%, rgba(0, 0, 0, 0.8) 100%);
  }

  /* 星のまたたき（このページだけの特別演出） */
  .complete-sparkles {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .complete-sparkles span {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #f5e3ae; box-shadow: 0 0 6px 1px rgba(245, 227, 174, 0.9);
    animation: sparkleTwinkle 3.4s ease-in-out infinite;
  }
  @keyframes sparkleTwinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* ===== お祭り騒ぎの紙吹雪（ずっと降り続ける） ===== */
  .complete-confetti {
    position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden;
  }
  .confetti-piece {
    position: absolute; top: -5vh;
    animation: confettiFall linear infinite;
    will-change: transform;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(112vh) translateX(var(--drift, 40px)) rotate(540deg); opacity: 0.9; }
  }

  /* ===== 打ち上げ花火 ===== */
  .complete-fireworks {
    position: fixed; inset: 0; z-index: 31; pointer-events: none; overflow: hidden;
  }
  .fw-trail {
    position: fixed;
    width: 3px; height: 3px; border-radius: 50%;
    background: #fff6dc;
    box-shadow: 0 0 8px 2px rgba(255, 246, 220, 0.9);
    transition: top 0.6s cubic-bezier(0.15, 0.6, 0.25, 1), opacity 0.25s ease;
    opacity: 1;
  }
  .fw-flash {
    position: fixed;
    width: 6px; height: 6px; border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: fwFlash 0.5s ease-out forwards;
  }
  @keyframes fwFlash {
    0% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
    100% { box-shadow: 0 0 0 64px transparent; opacity: 0; }
  }
  .fw-particle {
    position: fixed;
    width: 5px; height: 5px; border-radius: 50%;
    animation: fwPop 1.15s cubic-bezier(0.15, 0.6, 0.3, 1) forwards;
  }
  @keyframes fwPop {
    0% { transform: translate(-50%, -50%) translate(0, 0) scale(1); opacity: 1; }
    75% { opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--fx), var(--fy)) scale(0.3); opacity: 0; }
  }

  /* ===== 認定状カード ===== */
  #certCard {
    position: relative;
    border: 1.5px solid var(--gold);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75), 0 0 90px rgba(212, 175, 106, 0.22), inset 0 0 60px rgba(212, 175, 106, 0.08);
    text-align: center;
    overflow: visible;
  }
  /* カードの縁取りをもう一段（金の外枠 + 内側の細い光） */
  #certCard::before {
    content: "";
    position: absolute; inset: 6px;
    border: 1px solid rgba(212, 175, 106, 0.35);
    border-radius: calc(var(--radius) - 4px);
    pointer-events: none;
  }
  #certCard h2 { background: linear-gradient(135deg, #fdf3da, var(--gold)); }

  /* バッジの後ろで回り続ける光輪 */
  .cert-badge-wrap {
    position: relative;
    width: 132px; height: 132px;
    margin: 4px auto 10px;
  }
  .cert-badge-wrap::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(212, 175, 106, 0.55) 40deg, transparent 90deg, rgba(155, 127, 232, 0.45) 200deg, transparent 260deg, rgba(212, 175, 106, 0.5) 330deg, transparent 360deg);
    filter: blur(6px);
    animation: haloSpin 7s linear infinite;
  }
  @keyframes haloSpin {
    to { transform: rotate(360deg); }
  }

  .cert-badge {
    position: relative;
    width: 108px; height: 108px; margin: 12px auto 0;
    filter: drop-shadow(0 0 22px rgba(212, 175, 106, 0.55));
    animation: certSpin 2.2s cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
  }
  @keyframes certSpin {
    0% { opacity: 0; transform: scale(0.3) rotate(-30deg); }
    55% { opacity: 1; transform: scale(1.12) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .cert-eyebrow {
    font-family: var(--serif);
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    opacity: 0.85;
    margin-bottom: 2px;
  }
  .cert-title {
    font-family: var(--brush);
    font-size: 2.3rem;
    line-height: 1.3;
    background: linear-gradient(100deg, #fdf3da 10%, var(--gold) 30%, #fff6de 45%, #ecca87 60%, var(--gold) 80%, #fdf3da 95%);
    background-size: 260% 100%;
    animation: titleShimmer 5s ease-in-out infinite;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 22px var(--gold-glow));
    margin: 2px 0 14px;
  }
  @keyframes titleShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .cert-team {
    font-family: var(--serif);
    font-size: 1.15rem;
    color: var(--text);
    margin-bottom: 4px;
  }
  .cert-team b { color: var(--gold); }
  .cert-sub {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .cert-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--gold-deep); opacity: 0.7; font-size: 0.8rem;
    margin: 16px 0;
  }
  .cert-divider::before, .cert-divider::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
  }

  .cert-checklist { text-align: left; max-width: 340px; margin: 0 auto; }
  .cert-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 4px; font-size: 0.92rem; line-height: 1.6;
    border-bottom: 1px dashed rgba(212, 175, 106, 0.18);
  }
  .cert-row:last-child { border-bottom: none; }
  .cert-check {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #ecca87, var(--gold));
    color: #2c1c07; font-size: 0.8rem; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 10px rgba(212, 175, 106, 0.5);
  }
  .cert-row-label { color: var(--text); font-weight: 700; }
  .cert-row-detail { color: var(--text-dim); font-size: 0.82rem; margin-top: 2px; }

  .cert-keys-row { display: flex; justify-content: center; gap: 8px; margin: 4px 0 2px; }
  .cert-keys-row .k {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(160deg, #241735, #170f28);
    border: 1px solid rgba(212, 175, 106, 0.45);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 1rem; color: var(--gold);
    box-shadow: 0 0 8px rgba(212, 175, 106, 0.25);
  }

  .cert-secret-words { text-align: center; margin-top: 4px; }
  .cert-secret-words span {
    display: inline-block; font-family: var(--brush); font-size: 1.15rem;
    color: var(--gold); margin: 0 4px;
    text-shadow: 0 0 12px var(--gold-glow);
  }

  .cert-jump-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .cert-jump-list span {
    font-size: 0.76rem; color: var(--violet); background: rgba(155, 127, 232, 0.12);
    border: 1px solid rgba(155, 127, 232, 0.35); border-radius: 999px; padding: 3px 10px;
  }

  .cert-seal {
    margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(212, 175, 106, 0.2);
    font-family: var(--serif); font-size: 0.78rem; color: var(--text-dim);
    letter-spacing: 0.08em;
  }
  .cert-seal b { color: var(--gold); }

  .complete-actions { text-align: center; margin-top: 22px; }
</style>
</head>

<script>
(function () {
  const team = Store.load();

  function notYet() {
    document.getElementById("notYetCard").hidden = false;
  }

  if (!team) { notYet(); return; }

  const doorCleared = !!(team.finalGate && team.finalGate.solvedAt);
  const secretCleared = !!(team.secretGate && team.secretGate.solvedAt);
  const dummyCount = Store.dummySolvedCount(team);
  const fullClear = doorCleared && secretCleared && dummyCount >= DUMMY_TOTAL;

  if (!fullClear) { notYet(); return; }

  document.getElementById("certCard").hidden = false;
  document.getElementById("letterCard").hidden = false;
  document.getElementById("completeActions").hidden = false;

  // 星のまたたき背景（位置・タイミングをばらけさせる）
  (function scatterSparkles() {
    var box = document.getElementById("completeSparkles");
    var html = "";
    for (var i = 0; i < 26; i++) {
      var top = Math.random() * 100;
      var left = Math.random() * 100;
      var delay = (Math.random() * 3.4).toFixed(2);
      var dur = (2.6 + Math.random() * 2.2).toFixed(2);
      html += '<span style="top:' + top + '%; left:' + left + '%; animation-delay:' + delay + 's; animation-duration:' + dur + 's;"></span>';
    }
    box.innerHTML = html;
  })();

  document.getElementById("certTeamName").textContent = team.teamName || "冒険チーム";

  document.getElementById("certKozoAnswer").innerHTML =
    "<span>" + SMALL_PUZZLE_ANSWERS[0][0] + "</span><span>" + SMALL_PUZZLE_ANSWERS[1][0] + "</span>";

  const keysRow = document.getElementById("certKeysRow");
  keysRow.innerHTML = POINT_ORDER.map(function (p) {
    return '<div class="k">' + PUZZLES[p].choices[PUZZLES[p].answerIndex] + "</div>";
  }).join("");

  document.getElementById("certSecretWords").innerHTML =
    SECRET_WORDS.map(function (w) { return "<span>" + w.answers[0] + "</span>"; }).join("×");

  document.getElementById("certJumpLabel").textContent = "ジャンプの謎（全" + DUMMY_TOTAL + "）";
  document.getElementById("certJumpList").innerHTML =
    Object.keys(DUMMY_PUZZLES).map(function (n) {
      return "<span>" + DUMMY_PUZZLES[n].title + "</span>";
    }).join("");

  const now = new Date();
  document.getElementById("certDate").textContent =
    now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日";

  // 結び（「── ○○より」の行）を一通目の手紙（letter.html）と同じ形式にする：
  // 先頭の「──」を外し、両側を「―」で囲んで右詰め。
  (function renderLetter() {
    var el = document.getElementById("completeLetter");
    var lines = COMPLETE_MESSAGE.split("\n");
    var signIndex = -1;
    for (var i = lines.length - 1; i >= 0; i--) {
      if (lines[i].indexOf("──") === 0) { signIndex = i; break; }
    }
    if (signIndex === -1) { el.textContent = COMPLETE_MESSAGE; return; }
    el.textContent = lines.slice(0, signIndex).join("\n").replace(/\n+$/, "");
    var sign = document.createElement("span");
    sign.className = "letter-sign-right";
    sign.textContent = "― " + lines[signIndex].replace(/^──\s*/, "") + " ―";
    el.appendChild(sign);
  })();

  // お祭り騒ぎの紙吹雪。ずっと降り続ける（量は少し控えめに）。
  (function launchConfetti() {
    var box = document.getElementById("completeConfetti");
    var colors = ["#ff6b8a", "#ffcf5c", "#7bd6a0", "#6fb8ff", "#c98bff", "#f5e3ae", "#ff9f5c"];
    var html = "";
    for (var i = 0; i < 40; i++) {
      var left = Math.random() * 100;
      var size = 6 + Math.random() * 7;
      var isCircle = Math.random() < 0.4;
      var color = colors[Math.floor(Math.random() * colors.length)];
      var dur = (3.2 + Math.random() * 3.2).toFixed(2);
      var delay = (Math.random() * 6).toFixed(2);
      var drift = Math.round((Math.random() - 0.5) * 160) + "px";
      html +=
        '<span class="confetti-piece" style="left:' + left + '%; width:' + size + 'px; height:' + (size * (isCircle ? 1 : 1.5)) + 'px; background:' + color +
        '; border-radius:' + (isCircle ? "50%" : "2px") +
        '; animation-duration:' + dur + 's; animation-delay:' + delay + 's; --drift:' + drift + ';"></span>';
    }
    box.innerHTML = html;
  })();

  // 打ち上げ花火。大きめの本格的な爆発を、ずっと不定期に打ち上げ続ける。
  (function launchFireworks() {
    var box = document.getElementById("completeFireworks");
    var palette = ["#ff6b8a", "#ffcf5c", "#7bd6a0", "#6fb8ff", "#c98bff", "#f5e3ae", "#ffffff"];

    // 大玉：中心から広がる粒＋一拍おいて外側にもう一段（二重の花）
    function explode(x, y, color) {
      var flash = document.createElement("span");
      flash.className = "fw-flash";
      flash.style.left = x + "px";
      flash.style.top = y + "px";
      flash.style.color = color;
      box.appendChild(flash);
      setTimeout(function () { flash.remove(); }, 550);

      function ring(n, distBase, distSpread, sizePx, delayMs) {
        setTimeout(function () {
          for (var i = 0; i < n; i++) {
            var angle = (Math.PI * 2 * i) / n + Math.random() * 0.3;
            var dist = distBase + Math.random() * distSpread;
            var p = document.createElement("span");
            p.className = "fw-particle";
            p.style.left = x + "px";
            p.style.top = y + "px";
            p.style.width = sizePx + "px";
            p.style.height = sizePx + "px";
            p.style.background = color;
            p.style.setProperty("--fx", Math.cos(angle) * dist + "px");
            p.style.setProperty("--fy", (Math.sin(angle) * dist + 34) + "px");
            box.appendChild(p);
            (function (el) { setTimeout(function () { el.remove(); }, 1500); })(p);
          }
        }, delayMs);
      }
      // 内側の大玉 → 少し遅れて外側にもう一段（本格的な花火の「二重咲き」）
      ring(34, 70, 130, 6, 0);
      ring(20, 130, 60, 4, 90);
    }

    function launch(xPct) {
      var x = window.innerWidth * xPct;
      var y0 = window.innerHeight;
      var y1 = window.innerHeight * (0.14 + Math.random() * 0.24);
      var color = palette[Math.floor(Math.random() * palette.length)];
      var trail = document.createElement("span");
      trail.className = "fw-trail";
      trail.style.left = x + "px";
      trail.style.top = y0 + "px";
      trail.style.background = color;
      trail.style.boxShadow = "0 0 8px 2px " + color;
      box.appendChild(trail);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { trail.style.top = y1 + "px"; });
      });
      setTimeout(function () {
        trail.style.opacity = "0";
        explode(x, y1, color);
      }, 620);
      setTimeout(function () { trail.remove(); }, 900);
    }

    // 不定期に打ち上げ続ける（たまに2発同時で盛り上げる）
    function scheduleNext() {
      var wait = 1600 + Math.random() * 1800;
      setTimeout(function () {
        launch(0.15 + Math.random() * 0.7);
        if (Math.random() < 0.35) {
          setTimeout(function () { launch(0.15 + Math.random() * 0.7); }, 180 + Math.random() * 220);
        }
        scheduleNext();
      }, wait);
    }
    launch(0.3);
    setTimeout(function () { launch(0.65); }, 320);
    setTimeout(function () { launch(0.5); }, 640);
    scheduleNext();
  })();

  FX.circle({ count: 22 });
})();
</script>
