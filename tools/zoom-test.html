<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=10.0, user-scalable=yes">
<title>ズーム検証ページ</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #14102a; color: #fff; line-height: 1.7; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .scale { font-size: 40px; font-weight: bold; color: #f5c451; text-align: center;
           padding: 14px; background: #221a3d; border-radius: 12px; margin: 12px 0; }
  .result { background: #2a1f47; border: 2px solid #f5c451; border-radius: 12px;
            padding: 12px; margin: 12px 0; font-size: 17px; }
  .result b { color: #f5c451; }
  button { display: block; width: 100%; padding: 16px; margin: 10px 0; font-size: 17px;
           border-radius: 12px; border: none; background: #4b3a7a; color: #fff; font-weight: bold; }
  button.go { background: #f5c451; color: #1b1420; }
  p.note { font-size: 15px; color: #bbb; }
  ol { padding-left: 1.3em; font-size: 16px; }
</style>
</head>
<body>

<h1>ズーム検証ページ</h1>

<p class="note">いまの拡大率（1.00 が等倍）:</p>
<div class="scale" id="scale">-</div>

<div class="result" id="result" hidden></div>

<ol>
  <li>指で画面を<b>大きく拡大</b>する（上の数字が2.00くらいになる）</li>
  <li>下のボタンを<b>ひとつ</b>押す</li>
  <li>戻ってきた画面で、上の数字が <b>1.00 に戻っているか</b>を見る</li>
</ol>

<button class="go" id="btnNav">A：ページを移動するだけ</button>
<button class="go" id="btnReload">B：reload() で読み込み直す</button>
<button class="go" id="btnMeta">C：metaタグ差し替え（移動なし）</button>
<button class="go" id="btnWidth">D：meta幅トグル（移動なし）</button>
<button id="btnClear">記録を消す</button>

<p class="note">
A・B は画面が切り替わります。C・D はその場で試します（数字が変われば成功）。<br>
どのボタンで 1.00 に戻ったか教えてください。ひとつも戻らなければ「全部ダメ」と教えてください。
</p>

<script>
(function () {
  var scaleEl = document.getElementById("scale");
  var resultEl = document.getElementById("result");

  function scale() {
    return window.visualViewport ? window.visualViewport.scale : null;
  }
  function fmt(v) { return v === null ? "取得できず" : v.toFixed(2); }

  function paint() { scaleEl.textContent = fmt(scale()); }
  paint();
  setInterval(paint, 200);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", paint);
    window.visualViewport.addEventListener("scroll", paint);
  }

  // 直前の操作の記録を表示する
  try {
    var rec = sessionStorage.getItem("zoomtest");
    if (rec) {
      var r = JSON.parse(rec);
      resultEl.hidden = false;
      resultEl.innerHTML =
        "<b>" + r.label + "</b> の結果<br>" +
        "押す直前の倍率：<b>" + r.before + "</b><br>" +
        "戻ってきた直後の倍率：<b>" + fmt(scale()) + "</b>";
      sessionStorage.removeItem("zoomtest");
    }
  } catch (e) {}

  function record(label) {
    try {
      sessionStorage.setItem("zoomtest", JSON.stringify({ label: label, before: fmt(scale()) }));
    } catch (e) {}
  }

  document.getElementById("btnNav").addEventListener("click", function () {
    record("A：ページ移動");
    location.href = "zoom-test.html?n=" + Date.now();
  });

  document.getElementById("btnReload").addEventListener("click", function () {
    record("B：reload()");
    location.reload();
  });

  // その場で meta を差し替える（拡大禁止 → 元に戻す）
  document.getElementById("btnMeta").addEventListener("click", function () {
    var before = fmt(scale());
    var meta = document.querySelector('meta[name="viewport"]');
    var original = meta.getAttribute("content");
    var next = document.createElement("meta");
    next.setAttribute("name", "viewport");
    next.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no");
    meta.parentNode.replaceChild(next, meta);
    setTimeout(function () {
      var after = fmt(scale());
      var back = document.createElement("meta");
      back.setAttribute("name", "viewport");
      back.setAttribute("content", original);
      next.parentNode.replaceChild(back, next);
      resultEl.hidden = false;
      resultEl.innerHTML = "<b>C：metaタグ差し替え</b> の結果<br>前：<b>" + before +
        "</b> → 直後：<b>" + after + "</b>";
    }, 400);
  });

  // viewport の width を一瞬変えて再レイアウトさせる
  document.getElementById("btnWidth").addEventListener("click", function () {
    var before = fmt(scale());
    var meta = document.querySelector('meta[name="viewport"]');
    var original = meta.getAttribute("content");
    meta.setAttribute("content", "width=1200, initial-scale=1.0");
    setTimeout(function () {
      meta.setAttribute("content", "width=device-width, initial-scale=1.0");
      setTimeout(function () {
        var after = fmt(scale());
        meta.setAttribute("content", original);
        resultEl.hidden = false;
        resultEl.innerHTML = "<b>D：meta幅トグル</b> の結果<br>前：<b>" + before +
          "</b> → 直後：<b>" + after + "</b>";
      }, 400);
    }, 200);
  });

  document.getElementById("btnClear").addEventListener("click", function () {
    try { sessionStorage.removeItem("zoomtest"); } catch (e) {}
    resultEl.hidden = true;
  });
})();
</script>
</body>
</html>
